version: "3.9"

# ─── MediMind Development Stack ───────────────────────────────────────────────
# Run:              docker compose up -d
# API:              http://localhost:5000
# Hangfire:         http://localhost:5000/hangfire
# SignalR (queue):  ws://localhost:5000/hubs/queue
# SignalR (video):  ws://localhost:5000/hubs/video
# pgAdmin:          http://localhost:5050

services:

  # ─── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medimind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medimind_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: medimind_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medimind_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medimind_net

  # ─── pgAdmin ─────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: medimind_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@medimind.et
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medimind_net

  # ─── .NET 10 API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medimind_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      Firebase__ServiceAccountPath: "/run/secrets/firebase_sa"

      # --- DATABASE: uncomment ONE line, or leave both commented to use .env DB_CONNECTION ---
      # Local postgres container:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=medimind_db;Username=postgres;Password=medimind_dev_password;"
      # Render cloud DB (from .env):
      # ConnectionStrings__DefaultConnection: "${DB_CONNECTION}"

      # Auth & secrets (all values come from .env file)
      Jwt__SecretKey: "${JWT_SECRET}"
      Resend__ApiKey: "${RESEND_API_KEY}"
      Chapa__SecretKey: "${CHAPA_SECRET_KEY}"
      Chapa__PublicKey: "${CHAPA_PUBLIC_KEY}"
      Chapa__WebhookSecret: "${CHAPA_WEBHOOK_SECRET}"
      GeezSms__ApiKey: "${GEEZSMS_API_KEY}"
      Prescription__HmacSecret: "${PRESCRIPTION_HMAC_SECRET}"
      Agora__AppId: "${AGORA_APP_ID}"
      Agora__AppCertificate: "${AGORA_APP_CERTIFICATE}"
      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET}"
      SuperAdmin__Password: "${SUPERADMIN_PASSWORD}"
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./src/MediMind.API/firebase-service-account.json:/run/secrets/firebase_sa:ro
    networks:
      - medimind_net

volumes:
  postgres_data:
    name: medimind_postgres_data

networks:
  medimind_net:
    name: medimind_network
    driver: bridge
